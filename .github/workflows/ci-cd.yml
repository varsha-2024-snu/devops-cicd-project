
name: Task Manager CI/CD - Azure Container Apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/varsha-2024-snu/devops-cicd-project
  RESOURCE_GROUP: rg-myproject
  CONTAINER_APP: taskmanager-app

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven tests
        run: ./mvnw -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz
          tar --extract --gzip --file /tmp/gitleaks.tar.gz gitleaks
          sudo install --mode 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository and commit history
        run: gitleaks git --redact --no-banner .

  kubernetes-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: taskmanager-cluster

      - name: Build application image
        env:
          IMAGE_TAG: taskmanager:${{ github.sha }}
        run: docker build --tag "$IMAGE_TAG" .

      - name: Load application image into kind
        env:
          IMAGE_TAG: taskmanager:${{ github.sha }}
        run: kind load docker-image "$IMAGE_TAG" --name taskmanager-cluster

      - name: Deploy application to Kubernetes
        env:
          IMAGE_TAG: taskmanager:${{ github.sha }}
        run: |
          sed -i "s|ghcr.io/varsha-2024-snu/devops-cicd-project:latest|${IMAGE_TAG}|g" k8s/deployment.yaml
          kubectl create namespace taskmanager
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/taskmanager -n taskmanager --timeout=180s
          kubectl get pods -n taskmanager
          kubectl get service taskmanager-service -n taskmanager

      - name: Verify Kubernetes service health
        run: |
          kubectl port-forward -n taskmanager service/taskmanager-service 8081:8080 > /tmp/taskmanager-port-forward.log 2>&1 &
          PORT_FORWARD_PID=$!
          trap 'kill "$PORT_FORWARD_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 10 \
              http://127.0.0.1:8081/api/health; then
              echo "Kubernetes deployment is healthy."
              exit 0
            fi
            sleep 2
          done

          cat /tmp/taskmanager-port-forward.log
          echo "Kubernetes health check failed."
          exit 1

  publish-and-deploy:
    needs: [build-and-test, security-scan, kubernetes-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest \
            .
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE_NAME:${{ github.sha }}"

      - name: Verify live application
        run: |
          APP_URL=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              --max-time 15 "https://$APP_URL/api/health"; then
              echo "Deployment successful!"
              exit 0
            fi
            sleep 10
          done

          echo "Health check failed"
          exit 1
